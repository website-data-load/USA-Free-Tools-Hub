name: Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check site.js
      - name: Check required files
        run: test -f index.html && test -f styles.css && test -f site.js && test -f robots.txt && test -f sitemap.xml && test -f 404.html
